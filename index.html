<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dental Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f172a);
      --card-bg: var(--tg-theme-secondary-bg-color, #1e293b);
      --text: var(--tg-theme-text-color, #f8fafc);
      --hint: var(--tg-theme-hint-color, #94a3b8);
      --accent: var(--tg-theme-button-color, #38bdf8);
      --accent-text: var(--tg-theme-button-text-color, #0f172a);
      --badge-bg: rgba(56, 189, 248, 0.15);
      --danger: #f43f5e;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding-bottom: 90px;
    }

    /* Верхняя плашка и поиск */
    header {
      padding: 16px;
      position: sticky;
      top: 0;
      background: var(--bg);
      z-index: 10;
      backdrop-filter: blur(12px);
    }

    .brand-title {
      font-size: 22px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0 0 12px 0;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* Категории (чипсы) */
    .categories {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      scrollbar-width: none;
      padding-bottom: 4px;
    }
    .categories::-webkit-scrollbar { display: none; }

    .chip {
      padding: 8px 16px;
      border-radius: 20px;
      background: var(--card-bg);
      color: var(--hint);
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.2s ease;
      border: 1px solid rgba(255,255,255,0.05);
    }
    .chip.active {
      background: var(--accent);
      color: var(--accent-text);
      box-shadow: 0 4px 12px rgba(56, 189, 248, 0.3);
    }

    /* Сетка товаров */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      padding: 0 16px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 18px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.04);
      transition: transform 0.15s ease;
      position: relative;
    }
    .card:active {
      transform: scale(0.98);
    }

    .card-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--badge-bg);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }

    .card-img {
      width: 100%;
      height: 100px;
      border-radius: 12px;
      background: rgba(255,255,255,0.03);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 38px;
      margin-bottom: 10px;
    }

    .card-title {
      font-size: 14px;
      font-weight: 600;
      line-height: 1.3;
      margin: 0 0 6px 0;
      min-height: 36px;
    }

    .card-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 10px;
    }

    /* Кнопки добавления / счетчик */
    .btn-add {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      border-radius: 10px;
      padding: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.2s;
    }
    .btn-add:active { opacity: 0.8; }

    .counter-block {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 10px;
      padding: 4px;
    }
    .counter-btn {
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .counter-val {
      font-size: 14px;
      font-weight: 700;
    }

    /* Плавающая кнопка корзины внизу */
    .bottom-bar {
      position: fixed;
      bottom: 16px;
      left: 16px;
      right: 16px;
      background: var(--accent);
      color: var(--accent-text);
      padding: 14px 20px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 10px 25px rgba(56, 189, 248, 0.35);
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 100;
      transform: translateY(150%);
    }
    .bottom-bar.visible {
      transform: translateY(0);
    }

    /* Шторка корзины (Modal Drawer) */
    .drawer-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .drawer-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .drawer {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--card-bg);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      z-index: 201;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
      max-height: 80vh;
      display: flex;
      flex-direction: column;
    }
    .drawer.active {
      transform: translateY(0);
    }

    .drawer-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .drawer-items {
      overflow-y: auto;
      flex-grow: 1;
      margin-bottom: 16px;
    }
    .drawer-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .checkout-btn {
      width: 100%;
      background: var(--accent);
      color: var(--accent-text);
      border: none;
      padding: 16px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">🦷 Dental Equipment</div>
    <div class="categories">
      <div class="chip active" onclick="filterCategory('all', this)">Все товары</div>
      <div class="chip" onclick="filterCategory('handpieces', this)">Наконечники</div>
      <div class="chip" onclick="filterCategory('phantoms', this)">Фантомы</div>
      <div class="chip" onclick="filterCategory('therapy', this)">Терапия & Боры</div>
    </div>
  </header>

  <div class="grid" id="catalog"></div>

  <!-- Плавающая плашка корзины -->
  <div class="bottom-bar" id="cart-bar" onclick="openDrawer()">
    <span id="bar-count">Корзина: 0 шт.</span>
    <span id="bar-total">0 ₽ →</span>
  </div>

  <!-- Шторка корзины -->
  <div class="drawer-overlay" id="overlay" onclick="closeDrawer()"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <h3 style="margin:0; font-size:18px;">Ваш заказ</h3>
      <span style="cursor:pointer; font-size: 20px;" onclick="closeDrawer()">✕</span>
    </div>
    <div class="drawer-items" id="drawer-items"></div>
    <div style="display:flex; justify-content:space-between; margin-bottom: 16px; font-weight:800; font-size:18px;">
      <span>Итого к оплате:</span>
      <span id="drawer-total" style="color:var(--accent);">0 ₽</span>
    </div>
    <button class="checkout-btn" onclick="submitOrder()">Подтвердить заказ</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    const catalog = [
      { id: 1, cat: 'handpieces', icon: '⚡', badge: 'Хит', name: 'Турбинный наконечник с LED', price: 4200 },
      { id: 2, cat: 'handpieces', icon: '⚙️', badge: 'В наличии', name: 'Угловой наконечник 1:1', price: 2800 },
      { id: 3, cat: 'phantoms', icon: '💀', badge: 'Топ продаж', name: 'Фантом челюсти (32 зуба)', price: 3400 },
      { id: 4, cat: 'phantoms', icon: '🦷', badge: 'Запасной', name: 'Комплект зубов для фантома (28 шт.)', price: 1200 },
      { id: 5, cat: 'therapy', icon: '💎', badge: 'Набор', name: 'Алмазные боры (комплект 10 шт.)', price: 950 },
      { id: 6, cat: 'therapy', icon: '🛡️', badge: 'Изоляция', name: 'Набор коффердама (пробойник + щипцы)', price: 4900 }
    ];

    let cart = {}; // { id: count }
    let currentFilter = 'all';

    function renderCatalog() {
      const container = document.getElementById("catalog");
      container.innerHTML = "";

      const filtered = currentFilter === 'all' 
        ? catalog 
        : catalog.filter(p => p.cat === currentFilter);

      filtered.forEach(p => {
        const count = cart[p.id] || 0;
        const card = document.createElement("div");
        card.className = "card";
        card.innerHTML = `
          <div class="card-badge">${p.badge}</div>
          <div class="card-img">${p.icon}</div>
          <div class="card-title">${p.name}</div>
          <div class="card-price">${p.price.toLocaleString('ru-RU')} ₽</div>
          ${count === 0 
            ? `<button class="btn-add" onclick="updateCount(${p.id}, 1)">Купить</button>` 
            : `<div class="counter-block">
                <button class="counter-btn" onclick="updateCount(${p.id}, -1)">−</button>
                <span class="counter-val">${count}</span>
                <button class="counter-btn" onclick="updateCount(${p.id}, 1)">+</button>
               </div>`
          }
        `;
        container.appendChild(card);
      });

      updateCartBar();
    }

    function filterCategory(cat, el) {
      currentFilter = cat;
      document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
      el.classList.add('active');
      renderCatalog();
    }

    function updateCount(id, delta) {
      cart[id] = (cart[id] || 0) + delta;
      if (cart[id] <= 0) delete cart[id];
      renderCatalog();
      renderDrawer();
    }

    function calculateTotal() {
      let total = 0;
      let count = 0;
      for (let id in cart) {
        const prod = catalog.find(p => p.id == id);
        if (prod) {
          total += prod.price * cart[id];
          count += cart[id];
        }
      }
      return { total, count };
    }

    function updateCartBar() {
      const { total, count } = calculateTotal();
      const bar = document.getElementById("cart-bar");
      if (count > 0) {
        bar.classList.add("visible");
        document.getElementById("bar-count").innerText = `${count} шт.`;
        document.getElementById("bar-total").innerText = `${total.toLocaleString('ru-RU')} ₽ →`;
      } else {
        bar.classList.remove("visible");
        closeDrawer();
      }
    }

    function openDrawer() {
      renderDrawer();
      document.getElementById("overlay").classList.add("active");
      document.getElementById("drawer").classList.add("active");
    }

    function closeDrawer() {
      document.getElementById("overlay").classList.remove("active");
      document.getElementById("drawer").classList.remove("active");
    }

    function renderDrawer() {
      const container = document.getElementById("drawer-items");
      container.innerHTML = "";
      const { total } = calculateTotal();

      for (let id in cart) {
        const prod = catalog.find(p => p.id == id);
        const item = document.createElement("div");
        item.className = "drawer-item";
        item.innerHTML = `
          <div>
            <div style="font-weight:600; font-size:14px;">${prod.name}</div>
            <div style="color:var(--hint); font-size:12px;">${prod.price} ₽ × ${cart[id]}</div>
          </div>
          <div style="font-weight:700;">${(prod.price * cart[id]).toLocaleString('ru-RU')} ₽</div>
        `;
        container.appendChild(item);
      }
      document.getElementById("drawer-total").innerText = `${total.toLocaleString('ru-RU')} ₽`;
    }

    function submitOrder() {
      const { total, count } = calculateTotal();
      if (count === 0) return;

      const orderItems = [];
      for (let id in cart) {
        const prod = catalog.find(p => p.id == id);
        orderItems.push(`${prod.name} (${cart[id]} шт.)`);
      }

      const orderData = {
        items: orderItems.join(", "),
        totalPrice: total,
        count: count
      };

      tg.sendData(JSON.stringify(orderData));
    }

    renderCatalog();
  </script>
</body>
  </html>
