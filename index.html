<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Dental Student Store</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>

        /* Красивая стеклянная форма и карточки */
    .box {
      background: rgba(22, 32, 61, 0.7) !important;
      backdrop-filter: blur(14px) !important;
      -webkit-backdrop-filter: blur(14px) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
      border-radius: 16px !important;
      padding: 16px !important;
      margin-bottom: 14px !important;
    }

    /* Переключатель Вход / Регистрация */
    .auth-toggle {
      display: flex !important;
      background: rgba(0, 0, 0, 0.35) !important;
      border-radius: 10px !important;
      padding: 4px !important;
      margin-bottom: 16px !important;
    }

    .auth-tab {
      flex: 1 !important;
      text-align: center !important;
      padding: 10px !important;
      font-size: 13px !important;
      font-weight: 700 !important;
      border-radius: 8px !important;
      cursor: pointer !important;
      color: var(--hint) !important;
      transition: 0.2s !important;
    }

    .auth-tab.active {
      background: var(--accent) !important;
      color: var(--accent-text) !important;
    }

    /* Аккуратные поля ввода с подсказками сверху */
    .form-group {
      margin-bottom: 14px !important;
      display: flex !important;
      flex-direction: column !important;
      gap: 6px !important;
    }

    .form-group label {
      display: block !important;
      font-size: 12px !important;
      color: var(--hint) !important;
      font-weight: 600 !important;
    }

    .form-group input, 
    .form-group select, 
    .form-group textarea {
      width: 100% !important;
      box-sizing: border-box !important;
      padding: 12px 14px !important;
      border-radius: 10px !important;
      background: rgba(0, 0, 0, 0.25) !important;
      border: 1px solid rgba(255, 255, 255, 0.1) !important;
      color: #fff !important;
      font-size: 14px !important;
      outline: none !important;
      font-family: inherit !important;
    }

    .form-group input:focus, 
    .form-group select:focus {
      border-color: var(--accent) !important;
    }

    /* Неоновая синяя кнопка */
    .btn-buy {
      display: block !important;
      width: 100% !important;
      background: linear-gradient(135deg, #38bdf8 0%, #2563eb 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.35) !important;
      border-radius: 10px !important;
      border: none !important;
      padding: 12px !important;
      font-weight: 700 !important;
      font-size: 13px !important;
      cursor: pointer !important;
      text-align: center !important;
    }
    
        /* 1. Скрытие всех модальных окон (пока они не вызваны) */
    .modal {
      position: fixed !important;
      inset: 0 !important;
      background: rgba(0, 0, 0, 0.75) !important;
      z-index: 1000 !important;
      display: none !important;
      align-items: flex-end !important;
      justify-content: center !important;
      backdrop-filter: blur(8px) !important;
      -webkit-backdrop-filter: blur(8px) !important;
    }
    .modal.active {
      display: flex !important;
    }

    /* 2. Скрытие плавающей корзины по умолчанию */
    .cart-float {
      position: fixed !important;
      bottom: 65px !important;
      left: 16px !important;
      right: 16px !important;
      background: linear-gradient(135deg, #38bdf8, #2563eb) !important;
      box-shadow: 0 8px 25px rgba(37, 99, 235, 0.5) !important;
      color: #fff !important;
      padding: 12px 18px !important;
      border-radius: 14px !important;
      display: none !important;
      justify-content: space-between !important;
      align-items: center !important;
      font-weight: 700 !important;
      z-index: 99 !important;
    }

    /* 3. Горизонтальная нижняя панель навигации */
    .navbar {
      position: fixed !important;
      bottom: 0 !important;
      left: 0 !important;
      right: 0 !important;
      background: rgba(8, 13, 26, 0.9) !important;
      backdrop-filter: blur(16px) !important;
      -webkit-backdrop-filter: blur(16px) !important;
      border-top: 1px solid var(--card-border) !important;
      display: flex !important;
      flex-direction: row !important;
      justify-content: space-around !important;
      align-items: center !important;
      padding: 8px 0 !important;
      z-index: 100 !important;
    }

    .nav-item {
      display: flex !important;
      flex-direction: column !important;
      align-items: center !important;
      gap: 3px !important;
      color: var(--hint) !important;
      font-size: 11px !important;
      font-weight: 600 !important;
      cursor: pointer !important;
      flex: 1 !important;
      text-align: center !important;
    }
    .nav-item.active {
      color: var(--accent) !important;
    }
    .nav-item span:first-child {
      font-size: 18px !important;
    }


    
        /* Обязательное скрытие неактивных вкладок */
    .page-section {
      display: none !important;
      padding: 16px;
    }

    /* Отображение только активной вкладки */
    .page-section.active {
      display: block !important;
    }

    #page-catalog.page-section.active {
      padding: 0 !important;

<body>

  <!-- Вкладка: Каталог -->
  <div id="page-catalog" class="page-section active" style="padding:0;">
    <header>
      <div class="brand">🦷 Dental Student Store</div>
      <div class="tabs-nav">
        <div class="tab-btn active" onclick="switchMainTab('kits', this)">📦 Наборы</div>
        <div class="tab-btn" onclick="switchMainTab('instruments', this)">🛠️ Инструментарий</div>
        <div class="tab-btn" onclick="switchMainTab('clothes', this)">🥼 Спец.одежда</div>
        <div class="tab-btn" onclick="switchMainTab('courseworks', this)">📑 Курсовые</div>
        <div class="tab-btn" onclick="switchMainTab('courses', this)">🎓 Курсы</div>
      </div>

      <div class="subtabs" id="kits-subtabs">
        <div class="sub-btn active" onclick="switchSubTab('therapy', this)">Терапия</div>
        <div class="sub-btn" onclick="switchSubTab('endo', this)">Эндодонтия</div>
        <div class="sub-btn" onclick="switchSubTab('surgery', this)">Хирургия</div>
        <div class="sub-btn" onclick="switchSubTab('ozpt', this)">ОЗПТ</div>
      </div>
    </header>

    <div class="grid" id="catalog-grid"></div>
  </div>

  <!-- Вкладка: Профиль -->
  <div id="page-profile" class="page-section">
    <div class="brand">👤 Личный кабинет</div>
    
    <div class="box" id="auth-box">
      <div class="auth-toggle">
        <div class="auth-tab active" id="btn-mode-login" onclick="setAuthMode('login')">Вход</div>
        <div class="auth-tab" id="btn-mode-reg" onclick="setAuthMode('reg')">Регистрация</div>
      </div>

      <div class="form-group">
        <label>Telegram Ник / Логин</label>
        <input type="text" id="auth-username" placeholder="@username">
      </div>

      <div class="form-group">
        <label>Пароль</label>
        <input type="password" id="auth-password" placeholder="Ваш пароль">
      </div>

      <div class="form-group" id="reg-course-group" style="display:none;">
        <label>Курс обучения</label>
        <select id="auth-course">
          <option value="1">1 курс</option>
          <option value="2">2 курс</option>
          <option value="3">3 курс</option>
          <option value="4">4 курс</option>
          <option value="5">5 курс</option>
          <option value="Ординатор">Ординатор</option>
        </select>
      </div>

      <button class="btn-buy" style="padding:12px; margin-top:4px;" id="auth-submit-btn" onclick="handleAuthSubmit()">Войти в аккаунт</button>
    </div>

    <div class="box" id="profile-card" style="display:none;">
      <h3 id="prof-display-name" style="margin:0 0 4px 0;">Студент</h3>
      <p style="margin:0; color:var(--hint); font-size:14px;" id="prof-display-course">2 курс</p>
      <button onclick="logoutProfile()" style="background:none; border:none; color:var(--danger); font-size:12px; margin-top:12px; cursor:pointer; padding:0; font-weight:600;">Выйти из профиля</button>
    </div>

    <div class="box">
      <h4 style="margin:0 0 10px 0;">📦 Мои активные заказы</h4>
      <div id="orders-history" style="font-size:13px; color:var(--hint);">У вас пока нет активных заказов.</div>
    </div>
  </div>

  <!-- Вкладка: Поддержка -->
  <div id="page-support" class="page-section">
    <div class="brand">💬 Отдел поддержки</div>
    <div class="box">
      <h4>Консультация
